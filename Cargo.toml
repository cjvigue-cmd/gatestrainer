[package]
name = "gatestrainer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic checks for AI output. Only the exit code counts."
license = "MIT OR Apache-2.0"
repository = "https://github.com/cjvigue-cmd/gatestrainer"
readme = "README.md"
keywords = ["ai", "llm", "verification", "testing", "agents"]
categories = ["command-line-utilities", "development-tools::testing"]

[lib]
name = "gatestrainer"
path = "src/lib.rs"

[[bin]]
name = "gatestrainer"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
